services:
  authority-env:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    command: ["sh", "-c", "while :; do sleep 3600; done"]
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      LAB_ENVIRONMENT: authority
    networks:
      - lab
    volumes:
      - authority-state:/var/lib/online-authority-proof

  client-env:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    command: ["sh", "-c", "while :; do sleep 3600; done"]
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      LAB_ENVIRONMENT: client
    networks:
      - lab
    volumes:
      - client-state:/var/lib/online-authority-proof

networks:
  lab:
    internal: true

volumes:
  authority-state:
  client-state:
