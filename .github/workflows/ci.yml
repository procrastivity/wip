# CI for the Go implementation on main and wipd. The original bash implementation
# is preserved on bash-final.
#
# Releasing lives in release.yml, on its own tag trigger — this workflow
# never publishes. Keeping the two apart is what lets the release gate on
# `make check` without either workflow having to know the other's schedule.
name: CI

on:
  push:
    branches: [main, wipd]
  pull_request:
    branches: [main, wipd]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16
      - run: nix develop --command make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16
      - name: Archive and verify locked verifier flake inputs
        run: |
          nix flake archive --json --no-write-lock-file . > "$RUNNER_TEMP/step10-flake-archive.json"
          python3 - "$RUNNER_TEMP/step10-flake-archive.json" flake.lock <<'PY'
          import base64
          import json
          import sqlite3
          import sys
          from pathlib import Path

          alphabet = "0123456789abcdfghijklmnpqrsvwxyz"

          def nix_base32(data):
              bits = int.from_bytes(data, "little")
              return "".join(alphabet[(bits >> bit) & 31]
                             for bit in range(((len(data) * 8 - 1) // 5) * 5, -1, -5))

          archive = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          lock = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          archived_paths = set()

          def collect_paths(node):
              if not isinstance(node, dict):
                  raise SystemExit("nix flake archive returned a malformed input tree")
              path = node.get("path")
              if not isinstance(path, str) or not path.startswith("/nix/store/"):
                  raise SystemExit(f"archived flake input has a non-store path: {path!r}")
              archived_paths.add(path)
              inputs = node.get("inputs", {})
              if not isinstance(inputs, dict):
                  raise SystemExit("nix flake archive returned malformed inputs")
              for child in inputs.values():
                  collect_paths(child)

          collect_paths(archive)
          nodes = [(name, node) for name, node in sorted(lock["nodes"].items()) if name != "root"]
          if not nodes:
              raise SystemExit("flake.lock contains no locked inputs")

          db = sqlite3.connect("file:/nix/var/nix/db/db.sqlite?mode=ro", uri=True)
          try:
              for name, node in nodes:
                  nar_hash = node.get("locked", {}).get("narHash", "")
                  if not nar_hash.startswith("sha256-"):
                      raise SystemExit(f"locked input {name} has no SHA-256 NAR hash")
                  digest = base64.b64decode(nar_hash.removeprefix("sha256-"), validate=True)
                  ca = "fixed:r:sha256:" + nix_base32(digest)
                  rows = [row[0] for row in db.execute(
                      "SELECT path FROM ValidPaths WHERE ca=? ORDER BY path", (ca,))]
                  matching = [path for path in rows if path in archived_paths]
                  if not matching:
                      raise SystemExit(f"locked input {name} CA {ca} is not registered by flake archive")
                  print(f"{name}: ca={ca} path={','.join(matching)}")
          finally:
              db.close()
          print(f"ALL_LOCKED_FLAKE_INPUTS_REGISTERED={len(nodes)}")
          PY
      - name: Require the read-only external-source secret
        env:
          WIPD_STEP10_INPUT_TOKEN_CONFIGURED: ${{ secrets.WIP_REBOOT_READ_TOKEN != '' }}
        run: |
          if [[ "$WIPD_STEP10_INPUT_TOKEN_CONFIGURED" != "true" ]]; then
            echo "::error::Missing Actions secret WIP_REBOOT_READ_TOKEN; configure the approved read-only simensen/wip-reboot credential."
            exit 1
          fi
      - name: Checkout pinned Model source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: simensen/wip-reboot
          ref: 7caaf6e07f0b22d778f8431b37b2629a910b9b45
          token: ${{ secrets.WIP_REBOOT_READ_TOKEN }}
          path: .step10-input-sources/model
          sparse-checkout: MODEL.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout pinned Workplan source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: simensen/wip-reboot
          ref: 92d3bd5dbe9d39203f3722ba916c768002a133ae
          token: ${{ secrets.WIP_REBOOT_READ_TOKEN }}
          path: .step10-input-sources/workplan
          sparse-checkout: workplans/daemon-operation-parity-continuation.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare pinned Step 10 verifier inputs
        run: |
          make prepare-step10-verifier-inputs \
            MODEL_SOURCE_DIR="$GITHUB_WORKSPACE/.step10-input-sources/model" \
            WORKPLAN_SOURCE_DIR="$GITHUB_WORKSPACE/.step10-input-sources/workplan" \
            STEP10_INPUT_DIR="$RUNNER_TEMP/wipd-step10-verifier-inputs"
      - name: Run tests without checkout credentials
        run: nix develop --command make test
        env:
          GOFLAGS: -timeout=45m -count=1
          WIPD_STEP10_VERIFIER_INPUTS: ${{ runner.temp }}/wipd-step10-verifier-inputs

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16
      - run: nix build

  # Build-only, not executed — no native darwin runner; cross-compilation
  # means the linux runner is sufficient (HANDOFF §8/resolved open call).
  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { os: darwin, arch: arm64 }
          - { os: linux, arch: amd64 }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16
      - name: build ${{ matrix.target.os }}/${{ matrix.target.arch }}
        run: |
          nix develop --command env \
            CGO_ENABLED=0 GOOS=${{ matrix.target.os }} GOARCH=${{ matrix.target.arch }} \
            go build -o dist/wip-${{ matrix.target.os }}-${{ matrix.target.arch }} ./cmd/wip
