# Release for the Go line. Pushing an annotated `vX.Y.Z` tag is the only
# human action; this workflow derives everything else (release-engineering
# step-01). CHANGELOG.md is generated here per release and never committed,
# so nothing in the repo can disagree with the tag it was built from.
#
# The original bash history is preserved on `bash-final`; the Go history
# now lives on `main`. Existing tags retain their original commits.
name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags, both load-bearing: git-cliff walks the commit
      # graph to build the changelog, and the Makefile's `git describe`
      # stamps the version from the tag.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16

      # A tag can be pushed at a commit that never went through CI, so gate
      # the release on the same lint+test the branch workflow runs.
      - name: check
        run: nix develop --command make check

      - name: cross-compile
        run: nix develop --command make cross-compile

      # Binary bootstrap is separate from `wip install` harness projection.
      # Its public filename must agree with README.md (toolsmith T37).
      - name: installer
        run: cp scripts/install.sh dist/wip-install.sh

      - name: changelog
        run: |
          nix develop --command make changelog
          nix develop --command make release-notes TAG=${{ github.ref_name }}

      # Attached alongside the binaries so a curl-fetched binary can be
      # checked for transfer corruption. The installer and checksum file
      # themselves are trusted GitHub/HTTPS inputs, not authenticated here.
      - name: checksums
        working-directory: dist
        run: sha256sum wip-darwin-arm64 wip-linux-amd64 > SHA256SUMS

      # Assets are named explicitly, never globbed: dist/ also holds
      # RELEASE_NOTES.md, which is the body and not an asset.
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/wip-darwin-arm64 \
            dist/wip-linux-amd64 \
            dist/wip-install.sh \
            dist/SHA256SUMS \
            dist/CHANGELOG.md
